<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="login-container">
    
    <div class="avatar-circle">
      <i id="avatarIcon" class="fa-solid fa-user"></i>
    </div>

    <h2 id="formTitle">USER LOGIN</h2>

    <div id="alert" class="alert hidden"></div>

    <form id="authForm" novalidate>
      
      <div class="input-group">
        <label for="email">Username or Email</label>
        <div class="input-row">
          <div class="icon-circle">
            <i class="fa-regular fa-user side-icon"></i>
          </div>
          <div class="input-wrapper">
            <input type="text" id="email" name="email" placeholder="Enter username or email">
          </div>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-row">
          <div class="icon-circle">
            <i class="fa-solid fa-lock side-icon"></i>
          </div>
          <div class="input-wrapper password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter password">
            <button type="button" class="toggle-btn" data-target="password">Show</button>
          </div>
        </div>
      </div>

      <div class="input-group hidden" id="confirmPasswordGroup">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-row">
          <div class="icon-circle">
            <i class="fa-solid fa-shield-halved side-icon"></i>
          </div>
          <div class="input-wrapper password-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password">
            <button type="button" class="toggle-btn" data-target="confirmPassword">Show</button>
          </div>
        </div>
      </div>

      <div class="form-actions" id="loginActions">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a href="#" id="forgotPassword" class="forgot-pass">Forgot Password?</a>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">LOGIN</button>

      <div class="signup-footer">
        <span id="toggleText">Don't have an account?</span> 
        <a href="#" id="switchAuthMode" class="forgot-pass">Sign Up</a>
      </div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
